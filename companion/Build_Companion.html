<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slipstream Build Companion</title>
<style>
:root{--bg:#0f1115;--card:#181c23;--ink:#e8e6e1;--dim:#9aa3af;--acc:#4fc3f7;--ok:#6bd490;--warn:#f0b35c;--line:#2a3038}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:9;background:#0f1115ee;border-bottom:1px solid var(--line);padding:10px 16px}
h1{font-size:18px;margin:0 0 6px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 14px;border-radius:16px;cursor:pointer;font-size:13px}
.tab.on{background:var(--acc);color:#06222e;border-color:var(--acc);font-weight:600}
input[type=search]{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;flex:1;min-width:140px}
.sum{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--dim);margin-top:6px}
.sum b{color:var(--ink)}
main{max-width:980px;margin:0 auto;padding:16px}
.note{font-size:12.5px;color:var(--dim);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin-bottom:14px}
.phase{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.ph{display:flex;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}
.ph h2{font-size:15.5px;margin:0;flex:1}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--dim)}
.badge.v1{color:var(--ok);border-color:var(--ok)}
.badge.v2{color:var(--warn);border-color:var(--warn)}
.dots{color:var(--warn);letter-spacing:2px;font-size:12px}
.prog{font-size:12px;color:var(--dim)}
.body{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.phase.open .body{display:block}
.sec{margin:10px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:10px;padding:2px 9px;color:var(--acc);cursor:help}
ul{margin:6px 0;padding-left:20px}li{margin:3px 0}
.docs a{color:var(--acc);text-decoration:none;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:500;font-size:12px}
td.num,th.num{text-align:right;white-space:nowrap}
tr.done td{opacity:.45;text-decoration:line-through}
tr.done td.ck{text-decoration:none;opacity:1}
a.v{color:var(--acc);text-decoration:none}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--ok);cursor:pointer}
footer{color:var(--dim);font-size:12px;text-align:center;padding:20px}
</style></head><body>
<header>
 <h1>Slipstream Build Companion <span style="color:var(--dim);font-weight:400;font-size:13px">V1 energy trailer → V2 truck drive</span></h1>
 <div class="bar">
  <button class="tab on" data-f="all">All</button>
  <button class="tab" data-f="V1">V1</button>
  <button class="tab" data-f="V2">V2</button>
  <input type="search" id="q" placeholder="filter parts, vendors, phases…">
  <button class="tab" id="reset" title="clear all checkmarks">reset progress</button>
 </div>
 <div class="sum" id="sum"></div>
</header>
<main>
 <div class="note" id="note"></div>
 <div id="phases"></div>
</main>
<footer>Open-source · github.com/divergent-futures/slipstream · weights: engineering/flagship_mass_budget.py · procedures: guides/ · progress stored locally in this browser</footer>

const LS="slipstream-companion-v1";
let state={}; try{state=JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){}
let filt="all", query="";
const $=s=>document.querySelector(s);
const money=n=>(n<0?"−$":"$")+Math.abs(n).toLocaleString();
const save=()=>localStorage.setItem(LS,JSON.stringify(state));
function diffDots(d){return "●".repeat(d)+"○".repeat(5-d);}
function render(){
  $("#note").textContent=DATA.note;
  const box=$("#phases"); box.innerHTML="";
  DATA.phases.forEach(p=>{
    if(filt!=="all"&&p.v!==filt)return;
    const q=query.toLowerCase();
    const parts=p.parts.filter(i=>!q||(""+i.n+i.v+p.title).toLowerCase().includes(q));
    if(q&&!parts.length&&!p.title.toLowerCase().includes(q))return;
    const show=q?parts:p.parts;
    const done=p.parts.filter(i=>state[p.id+"|"+i.n]).length;
    const el=document.createElement("div");
    el.className="phase"+((state["open|"+p.id]??(p.id==="P0"))?" open":"");
    const skills=p.skills.map(s=>{const k=DATA.skills[s];return `<span class="chip" title="${k.level} — ${k.learn}">${k.name}</span>`}).join("");
    const rows=show.map(i=>{const key=p.id+"|"+i.n,on=!!state[key];return `
      <tr class="${on?"done":""}"><td class="ck"><input type="checkbox" data-k="${key}" ${on?"checked":""}></td>
      <td>${i.n}</td><td class="num">${money(i.c)}</td><td class="num">${i.lb?i.lb+" lb":"—"}</td>
      <td>${i.u?`<a class="v" href="${i.u}" target="_blank" rel="noopener">${i.v}</a>`:i.v}</td></tr>`}).join("");
    const cost=p.parts.reduce((a,i)=>a+i.c,0), lb=p.parts.reduce((a,i)=>a+i.lb,0);
    el.innerHTML=`
     <div class="ph" data-p="${p.id}">
      <span class="badge ${p.v.toLowerCase()}">${p.v}</span><h2>${p.id} · ${p.title}</h2>
      <span class="dots" title="difficulty ${p.diff}/5">${diffDots(p.diff)}</span>
      <span class="prog">${done}/${p.parts.length} · ${money(cost)}${lb?" · "+lb+" lb":""}</span>
     </div>
     <div class="body">
      <div class="sec">Skills</div><div class="chips">${skills}</div>
      <div class="sec">Instructions</div><div>${p.instructions}</div>
      <div class="sec">Challenges</div><ul>${p.challenges.map(c=>`<li>${c}</li>`).join("")}</ul>
      <div class="sec">Engineering docs (in repo)</div><div class="docs">${p.docs.map(d=>`<a>${d}</a>`).join(" · ")}</div>
      <div class="sec">Parts &amp; sourcing</div>
      <table><tr><th></th><th>Item</th><th class="num">Est $</th><th class="num">Est wt</th><th>Where to buy</th></tr>${rows}</table>
     </div>`;
    box.appendChild(el);
  });
  const ph=DATA.phases.filter(p=>filt==="all"||p.v===filt);
  const all=ph.flatMap(p=>p.parts.map(i=>({...i,key:p.id+"|"+i.n})));
  const doneItems=all.filter(i=>state[i.key]);
  $("#sum").innerHTML=`
   <span>items <b>${doneItems.length}/${all.length}</b></span>
   <span>est. total <b>${money(all.reduce((a,i)=>a+i.c,0))}</b></span>
   <span>committed so far <b>${money(doneItems.reduce((a,i)=>a+i.c,0))}</b></span>
   <span>tracked weight <b>${all.reduce((a,i)=>a+i.lb,0).toLocaleString()} lb</b> <span style="font-size:11px">(full matrix: flagship_mass_budget.py)</span></span>`;
}
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.matches(".tab[data-f]")){document.querySelectorAll(".tab[data-f]").forEach(x=>x.classList.remove("on"));t.classList.add("on");filt=t.dataset.f;render();}
  if(t.id==="reset"&&confirm("Clear all checkmarks?")){state={};save();render();}
  const ph=t.closest(".ph"); if(ph&&!t.matches("input")){const id="open|"+ph.dataset.p;state[id]=!(state[id]??(ph.dataset.p==="P0"));save();
    ph.parentElement.classList.toggle("open");}
  if(t.matches("input[type=checkbox]")){state[t.dataset.k]=t.checked;if(!t.checked)delete state[t.dataset.k];save();render();}
});
$("#q").addEventListener("input",e=>{query=e.target.value;render();});
render();
</script></body></html>
